  # auto_route_generator: ^10.2.4
  flutter_gen_runner: ^5.8.0
  freezed: ^3.2.0
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/translations/
    - assets/splash/
    - assets/lottie/
    - .env

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.jpg"  
