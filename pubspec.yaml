dev_dependencies:
  flutter_test:
    sdk: flutter
  analyzer: ^7.0.0
  flutter_lints: ^6.0.0
  riverpod_generator: ^3.0.0-dev.17
  build_runner: ^2.4.13
  custom_lint: ^0.8.0
